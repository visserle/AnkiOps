[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ankiops"
version = "0.6.6c"
description = "Anki ↔ Markdown, with bidirectional sync, custom note types, and LLM integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Education",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "blake3>=1.0.11",
    "html-to-markdown>=3.18.6",
    "mistune>=3.4.0",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "pygments>=2.21.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
]
[project.urls]
Repository = "https://github.com/visserle/AnkiOps"
Issues = "https://github.com/visserle/AnkiOps/issues"

[project.scripts]
ankiops = "ankiops.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.8",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.2",
    "types-PyYAML>=6.0.12.20260906",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ankiops*"]

[tool.setuptools.package-data]
ankiops = [
    "tutorial/*.md",
    "default_note_types/**/*.anki",
    "default_note_types/**/*.css",
    "default_note_types/**/*.yaml",
    "collab/resources/.gitignore",
    "collab/resources/README.md",
    "llm/resources/*.yaml",
    "llm/resources/README.md",
    "llm/resources/_system_prompt.md",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F"]
extend-select = ["I"]
unfixable = ["F401"]  # do not auto-remove unused imports

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
markers = ["live_llm: opt-in tests that call real external LLM models"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
